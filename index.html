<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --ink:#14181F; --mute:#6A7380; --card:#FFFFFF; --line:#D9DEE4;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1318;--ink:#EEF1F4;--mute:#8B94A1;--card:#1A2028;--line:#2A323D}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);}
body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px}
header .month{color:var(--mute);font-size:15px}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px}
.hero{padding:8px 0 22px}
.hero .label{color:var(--mute);font-size:14px}
.hero .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.05;letter-spacing:-0.02em}
.hero .sub{color:var(--mute);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:20px;aspect-ratio:1/1;padding:16px;text-align:left;color:#fff;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--body);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .name{font-size:16px;font-weight:600}
.tile .left{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:-0.01em}
.tile .of{font-size:12px;opacity:.85;margin-top:5px}
.tile .carry{font-size:11px;opacity:.85}
.tile.locked{background:repeating-linear-gradient(135deg,#1b1b1b 0 10px,#242424 10px 20px);color:#9a9a9a;filter:grayscale(1);cursor:not-allowed}
.tile.locked .left{font-size:20px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:18px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:92vh;overflow:auto}
.sheet h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.sheet .meta{color:var(--mute);font-size:14px;margin-bottom:16px}
.amount{width:100%;font-family:var(--display);font-weight:700;font-size:44px;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:6px 0;outline:none}
.amount:focus{border-color:var(--ink)}
.after{color:var(--mute);font-size:14px;margin:8px 0 18px;min-height:20px}
.after.bad{color:#d6336c}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;font-family:var(--body);margin-top:10px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:#d6336c;border:1.5px solid var(--line)}
.btn:disabled,.btn.disabled{opacity:.35}
.btn.disabled{pointer-events:none}
a.btn{display:block;text-align:center;text-decoration:none}

.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font-size:16px;font-family:var(--body);min-width:0}
.row input.n{flex:1}.row input.a{width:92px;text-align:right}
.row button{border:0;background:transparent;color:var(--mute);font-size:20px;width:32px}
.field{display:block;margin:14px 0 6px;color:var(--mute);font-size:13px}
.field + input,.field + select{width:100%;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:11px;font-size:16px;font-family:var(--body)}
.field + select option{color:#000}
.unalloc{font-size:14px;margin:6px 0 4px}
.hist{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.hist small{color:var(--mute);display:block}
.hist button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12px}
.sect{font-family:var(--display);font-size:18px;margin:24px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:88vw}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="month" id="month"></div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">⚙</button>
  </header>
  <section class="hero">
    <div class="label">Left to spend</div>
    <div class="big" id="total"></div>
    <div class="sub" id="totalSub"></div>
  </section>
  <section class="grid" id="grid"></section>
  <p class="hint">Tap a category to spend from it. Empty categories stay locked until next month.</p>
</div>

<!-- pay sheet -->
<div class="scrim" id="paySheet"><div class="sheet">
  <h2 id="payTitle"></h2>
  <div class="meta" id="payMeta"></div>
  <input class="amount" id="amt" type="number" inputmode="decimal" placeholder="₹0" min="0" step="any">
  <div class="after" id="after"></div>
  <a class="btn primary disabled" id="openBtn" href="#">Open app to pay</a>
  <div class="after" style="margin:6px 0 0;font-size:12px">Deducts the amount, copies it, and opens your UPI app. Scan the QR there and paste or type the amount.</div>
  <button class="btn ghost" id="cashBtn" disabled>Log cash spend</button>
  <button class="btn ghost" data-close>Cancel</button>
</div></div>

<!-- did it work? -->
<div class="scrim" id="doneSheet"><div class="sheet">
  <h2>Did the payment go through?</h2>
  <div class="meta" id="doneMeta"></div>
  <button class="btn primary" id="doneYes">Yes, it went through</button>
  <button class="btn ghost" id="doneNo">No, refund it to the category</button>
  <button class="btn ghost" id="doneLater">Ask me later</button>
</div></div>

<!-- settings sheet -->
<div class="scrim" id="setSheet"><div class="sheet">
  <h2>Settings</h2>
  <label class="field" for="setBudget">Monthly budget (₹)</label>
  <input id="setBudget" type="number" inputmode="decimal">
  <label class="field" for="setUpi">UPI app to open when paying</label>
  <select id="setUpi">
    <option value="phonepe">PhonePe</option>
    <option value="gpay">Google Pay</option>
    <option value="paytm">Paytm</option>
    <option value="generic">Other (iOS picks)</option>
  </select>
  <label class="field" for="setScan">Experimental: link that opens the app's scanner (leave empty if unknown)</label>
  <input id="setScan" placeholder="e.g. a scanner link you find for your app">
  <div class="sect">Categories</div>
  <div id="catRows"></div>
  <button class="btn ghost" id="addCat" style="margin-top:0">+ Add category</button>
  <div class="unalloc" id="unalloc"></div>
  <button class="btn primary" id="saveSet">Save</button>
  <div class="sect">This month's spending</div>
  <div id="hist"></div>
  <button class="btn danger" id="resetAll">Erase all data</button>
  <button class="btn ghost" data-close>Close</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
const KEY='budgetapp.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthName=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})};
const nextMonth=k=>{let [y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const uid=()=>Math.random().toString(36).slice(2,9);

const SCHEMES={
  phonepe:{name:'PhonePe',base:'phonepe://pay?',open:'phonepe://'},
  gpay:{name:'Google Pay',base:'gpay://upi/pay?',open:'gpay://'},
  paytm:{name:'Paytm',base:'paytmmp://pay?',open:'paytmmp://'},
  generic:{name:'UPI app',base:'upi://pay?',open:'upi://'}
};

function defaults(){
  const mk=(name,a)=>({id:uid(),name,alloc:a,cap:a,bal:a,carry:0});
  return {budget:2000,upi:'phonepe',month:ym(new Date()),
    categories:[mk('Canteen',600),mk('Entertainment',400),mk('Clothes',500),mk('Transport',300),mk('Other',200)],
    log:[]};
}
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.categories)S=defaults();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save data')}}

// month rollover: leftover balance is added to the next month's budget
function rollover(){
  const now=ym(new Date());
  let changed=false;
  while(S.month<now){
    S.categories.forEach(c=>{
      c.carry=Math.max(0,c.bal);
      c.cap=c.alloc+c.carry;
      c.bal=c.cap;
    });
    S.month=nextMonth(S.month);
    S.log=[];
    changed=true;
  }
  if(changed)save();
}

function tileColor(c){
  const p=c.cap>0?Math.max(0,Math.min(1,c.bal/c.cap)):0;
  const hue=p>=0.8?135:135*(p/0.8);
  return `hsl(${hue.toFixed(0)} 68% ${p>=0.8?36:40}%)`;
}

function render(){
  $('#month').textContent=monthName(S.month);
  const left=S.categories.reduce((a,c)=>a+Math.max(0,c.bal),0);
  const cap=S.categories.reduce((a,c)=>a+c.cap,0);
  const carry=S.categories.reduce((a,c)=>a+c.carry,0);
  $('#total').textContent=inr(left);
  $('#totalSub').textContent='of '+inr(cap)+(carry>0?' · includes '+inr(carry)+' carried over':'');
  $('#grid').innerHTML=S.categories.map(c=>{
    const locked=c.bal<=0;
    if(locked)return `<button class="tile locked" data-id="${c.id}" aria-disabled="true"><div class="name">${esc(c.name)}</div><div><div class="left">Locked</div><div class="of">until ${esc(monthName(nextMonth(S.month)).split(' ')[0])}</div></div></button>`;
    return `<button class="tile" data-id="${c.id}" style="background:${tileColor(c)}"><div class="name">${esc(c.name)}</div><div><div class="left">${inr(c.bal)}</div><div class="of">of ${inr(c.cap)}</div>${c.carry>0?`<div class="carry">+${inr(c.carry)} carried</div>`:''}</div></button>`;
  }).join('');
}

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const open=id=>$(id).classList.add('open');
const close=id=>$(id).classList.remove('open');
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('.scrim').classList.remove('open')));

// ---- pay flow
let cur=null; // category being spent from
$('#grid').addEventListener('click',e=>{
  const t=e.target.closest('.tile');if(!t)return;
  const c=S.categories.find(x=>x.id===t.dataset.id);
  if(!c)return;
  if(c.bal<=0){toast(c.name+' is locked until next month');return}
  cur=c;
  $('#payTitle').textContent=c.name;
  $('#payMeta').textContent=inr(c.bal)+' left';
  $('#amt').value='';
  setOpenLink();
  checkAmt();
  open('#paySheet');
  setTimeout(()=>$('#amt').focus(),150);
});
function setOpenLink(){
  const b=$('#openBtn');
  b.href=S.scanLink||SCHEMES[S.upi].open;
  b.textContent='Open '+SCHEMES[S.upi].name+' to pay';
}
function amtVal(){const v=parseFloat($('#amt').value);return isFinite(v)?Math.round(v*100)/100:0}
function checkAmt(){
  const v=amtVal(),a=$('#after');
  const ok=v>0&&v<=cur.bal;
  a.classList.toggle('bad',v>cur.bal);
  a.textContent=v>cur.bal?('Over by '+inr(v-cur.bal)):(v>0?('Left after this: '+inr(cur.bal-v)):'');
  $('#cashBtn').disabled=!ok;
  $('#openBtn').classList.toggle('disabled',!ok);
}
$('#amt').addEventListener('input',checkAmt);

function spend(c,amount,payee){
  c.bal=Math.round((c.bal-amount)*100)/100;
  const id=uid();
  S.log.unshift({id,cat:c.id,catName:c.name,amount,payee:payee||'Cash',t:Date.now()});
  save();render();
  return id;
}
$('#openBtn').addEventListener('click',e=>{
  const v=amtVal();
  if(!(v>0&&v<=cur.bal)){e.preventDefault();return}
  const id=spend(cur,v,SCHEMES[S.upi].name);
  S.awaiting=id;save();
  try{navigator.clipboard.writeText(v.toFixed(2)).catch(()=>{})}catch(err){}
  close('#paySheet');
});
$('#cashBtn').addEventListener('click',()=>{
  const v=amtVal();if(!(v>0&&v<=cur.bal))return;
  spend(cur,v,'Cash');close('#paySheet');toast(inr(v)+' logged to '+cur.name);
});

// After returning from the UPI app, ask whether the payment worked.
function checkAwaiting(){
  if(!S.awaiting)return;
  const l=S.log.find(x=>x.id===S.awaiting);
  if(!l){S.awaiting=null;save();return}
  $('#doneMeta').textContent=inr(l.amount)+' to '+l.payee+' from '+l.catName;
  open('#doneSheet');
}
$('#doneYes').addEventListener('click',()=>{S.awaiting=null;save();close('#doneSheet');toast('Recorded')});
$('#doneNo').addEventListener('click',()=>{
  const i=S.log.findIndex(x=>x.id===S.awaiting);
  if(i>=0){const l=S.log[i],c=S.categories.find(x=>x.id===l.cat);if(c)c.bal=Math.round((c.bal+l.amount)*100)/100;S.log.splice(i,1)}
  S.awaiting=null;save();render();close('#doneSheet');toast('Refunded')
});
$('#doneLater').addEventListener('click',()=>close('#doneSheet'));

// ---- settings
let draft=[];
$('#openSettings').addEventListener('click',()=>{
  $('#setBudget').value=S.budget;
  $('#setUpi').value=S.upi;
  $('#setScan').value=S.scanLink||'';
  draft=S.categories.map(c=>({id:c.id,name:c.name,alloc:c.alloc}));
  renderRows();renderHist();open('#setSheet');
});
function renderRows(){
  $('#catRows').innerHTML=draft.map((d,i)=>`<div class="row"><input class="n" data-i="${i}" data-f="name" value="${esc(d.name)}" aria-label="Category name"><input class="a" data-i="${i}" data-f="alloc" type="number" inputmode="decimal" value="${d.alloc}" aria-label="Amount"><button data-del="${i}" aria-label="Remove">×</button></div>`).join('');
  updUnalloc();
}
function updUnalloc(){
  const b=parseFloat($('#setBudget').value)||0;
  const sum=draft.reduce((a,d)=>a+(+d.alloc||0),0);
  const u=$('#unalloc');
  u.textContent=sum>b?('Categories add up to '+inr(sum)+', which is '+inr(sum-b)+' over your budget.'):('Unassigned: '+inr(b-sum));
  u.style.color=sum>b?'#d6336c':'';
}
$('#catRows').addEventListener('input',e=>{
  const i=e.target.dataset.i,f=e.target.dataset.f;if(i===undefined)return;
  draft[i][f]=f==='alloc'?(parseFloat(e.target.value)||0):e.target.value;
  updUnalloc();
});
$('#catRows').addEventListener('click',e=>{
  const i=e.target.dataset.del;if(i===undefined)return;
  if(!confirm('Remove "'+draft[i].name+'"? Its remaining balance is dropped when you save.'))return;
  draft.splice(i,1);renderRows();
});
$('#setBudget').addEventListener('input',updUnalloc);
$('#addCat').addEventListener('click',()=>{draft.push({id:null,name:'New category',alloc:0});renderRows()});
$('#saveSet').addEventListener('click',()=>{
  const b=parseFloat($('#setBudget').value)||0;
  const sum=draft.reduce((a,d)=>a+(+d.alloc||0),0);
  if(sum>b){toast('Categories add up to more than your budget');return}
  const next=draft.map(d=>{
    const old=d.id&&S.categories.find(c=>c.id===d.id);
    if(old){const delta=d.alloc-old.alloc;return Object.assign({},old,{name:d.name.trim()||'Untitled',alloc:d.alloc,cap:old.cap+delta,bal:old.bal+delta})}
    return {id:uid(),name:d.name.trim()||'Untitled',alloc:d.alloc,cap:d.alloc,bal:d.alloc,carry:0};
  });
  S.categories=next;S.budget=b;S.upi=$('#setUpi').value;S.scanLink=$('#setScan').value.trim();
  save();render();close('#setSheet');toast('Saved');
});
function renderHist(){
  const h=$('#hist');
  if(!S.log.length){h.innerHTML='<div class="meta">Nothing spent yet this month.</div>';return}
  h.innerHTML=S.log.map(l=>`<div class="hist"><div>${inr(l.amount)} · ${esc(l.catName)}<small>${esc(l.payee)} · ${new Date(l.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</small></div><button data-undo="${l.id}">Undo</button></div>`).join('');
}
$('#hist').addEventListener('click',e=>{
  const id=e.target.dataset.undo;if(!id)return;
  const i=S.log.findIndex(l=>l.id===id);if(i<0)return;
  const l=S.log[i],c=S.categories.find(x=>x.id===l.cat);
  if(c)c.bal=Math.round((c.bal+l.amount)*100)/100;
  S.log.splice(i,1);save();render();renderHist();toast('Refunded '+inr(l.amount)+' to '+l.catName);
});
$('#resetAll').addEventListener('click',()=>{
  if(!confirm('Erase everything and start over?'))return;
  localStorage.removeItem(KEY);load();render();close('#setSheet');
});

// close sheets by tapping the dark area
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('open')}));

load();rollover();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();render();setTimeout(checkAwaiting,500)}});
setTimeout(checkAwaiting,600);
})();
</script>
</body>
</html>
